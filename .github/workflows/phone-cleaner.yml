name: PhoneCleaner APK

on:
  push:
    paths:
      - 'phone-cleaner/**'
      - '.github/workflows/phone-cleaner.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-cleaner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCleaner-debug-apk
          path: phone-cleaner/app/build/outputs/apk/debug/app-debug.apk
